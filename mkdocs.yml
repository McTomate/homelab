# Name, der oben links auf der Seite steht
site_name: Homelab-Dokumentation
site_url: https://mctomate.github.io/homelab/

theme:
  name: material
  language: de
  # Umschalter zwischen hellem und dunklem Design
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dunkles Design
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Helles Design
  features:
    - content.code.copy     # Kopier-Button an Codeblöcken
    - search.highlight      # Suchbegriffe auf der Seite markieren
    - navigation.sections   # Menü-Abschnitte als Gruppen anzeigen
    - navigation.top        # "Nach oben"-Button bei langen Seiten

# Menü: neue Seiten hier eintragen, sonst erscheinen sie nicht in der Navigation
nav:
  - Übersicht: index.md
  - Hardware: hardware.md
  - Netzwerk: netzwerk.md
  - Remote Access: remote-access.md
  - Dienste: dienste.md
  - Projekte:
      - Smart Home über VLAN-Grenzen: projekte/smart-home.md
      - Windows-AD-Lab: projekte/windows-ad.md
  - Roadmap: roadmap.md

# Zusätzliche Markdown-Funktionen (Hinweisboxen, Code-Hervorhebung, Checklisten)
markdown_extensions:
  - admonition
  - attr_list               # Bildgröße angeben: ![...](bild.png){ width="49%" }
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:          # ```mermaid-Blöcke als Diagramm zeichnen
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
